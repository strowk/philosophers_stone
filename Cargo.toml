[package]
name = "philosopher_stone"
version = "0.1.0"
edition = "2024"

[features]
download-model-native = ["dep:ureq"]
# download-model-wasm = ["dep:futures-util", "dep:reqwest", "reqwest/stream"]
download-model-wasm = []
default = ["superui/hmr", "bevy/file_watcher", "download-model-native", "bevy/debug"]
web = ["bevy/webgl2", "download-model-wasm"]

[dependencies]
anyhow = "1.0.104"
bevy = { version = "0.20", default-features = false, features = ["2d", "ui", "audio"] }
superui = { git = "https://github.com/strowk/bevy_superui.git", branch = "main", features = ["utilities"]}
dirs = "7.0.0"
laya-rs2 = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5.0", optional = true }
# reqwest = { version = "0.13.5", optional = true }
# futures-util = { version = "0.3.34", optional = true }
reqwest = { version = "0.13.5" , features = ["stream"] }
bytes = { version = "1.12.1" }
futures-util = { version = "0.3.34"  }
crossbeam-channel = "0.5.17"

[build-dependencies]
supersolid = { git = "https://github.com/strowk/bevy_superui", branch = "main" }
superui_css_utilities = { git = "https://github.com/strowk/bevy_superui", branch = "main" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
tokio = { version = "1.54.1", features = ["rt"] }

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies.web-sys]
version = "0.3"
features = [
    "Blob", 
    "BlobPropertyBag", 
    "console", 
    "CssStyleDeclaration", 
    "Document", 
    "HtmlAnchorElement", 
    "HtmlElement", 
    "Url", 
    "Window",
    "CacheStorage",
    "Cache",
    "Response",
    "Worker",
    "WorkerOptions",
    "WorkerType",
    "MessageEvent",
    "DedicatedWorkerGlobalScope"
]
